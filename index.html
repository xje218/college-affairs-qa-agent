<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>学院事务咨询助手</title>
<style>
  :root{
    --blue:#2E5C8A; --bg:#f4f7fb; --card:#fff;
    --line:#c8d3e0; --green:#27AE60; --red:#e74c3c; --text:#22303C; --muted:#6b7b8a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);font-size:16px;line-height:1.7;max-width:720px;margin:0 auto}
  header{background:var(--blue);color:#fff;padding:18px 16px 14px;position:sticky;top:0;z-index:5;
    box-shadow:0 2px 8px rgba(0,0,0,.12)}
  header h1{font-size:19px;margin:0 0 4px}
  header p{margin:0;font-size:12.5px;opacity:.92}
  main{padding:14px 14px 40px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 6px}
  .chip{background:#eaf1f8;color:var(--blue);border:1px solid #d4e1f0;border-radius:16px;
    padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
  .chip:active{background:#d4e1f0}
  .box{display:flex;gap:8px;margin-top:6px}
  #q{font:inherit;flex:1;padding:12px 14px;border:1px solid var(--line);border-radius:10px;
    background:#fff;outline:none}
  #q:focus{border-color:var(--blue)}
  #ask{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:0 18px;font-size:15px;font-weight:600;cursor:pointer}
  #ask:active{opacity:.85}
  .msg{margin-top:14px;border-radius:12px;padding:14px 15px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .user{background:#eaf1f8;border-left:4px solid var(--blue)}
  .bot{background:var(--card);border-left:4px solid var(--green)}
  .bwarning{background:#fff7e6;border-left:4px solid #f39c12}
  .bfallback{background:#fdecea;border-left:4px solid var(--red)}
  .seg{margin:10px 0}
  .seg .lab{font-weight:700;color:var(--blue);font-size:13px;margin-bottom:2px}
  .seg .val{font-size:15px}
  .src{background:#f7fafd;border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin-top:6px;font-size:13px;color:#33424f}
  .src b{color:var(--blue)}
  .meta{font-size:12px;color:var(--muted);margin-top:8px}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:18px 14px 26px;border-top:1px solid var(--line);margin-top:18px}
  #loaderr{display:none;background:#fdecea;color:var(--red);padding:10px;border-radius:8px;margin-top:12px;font-size:13px}
  .typing{color:var(--muted);font-size:13px;margin-top:10px}
</style>
</head>
<body>
<header>
  <h1>学院事务咨询助手</h1>
  <p>覆盖补考·缓考·重修·成绩复核 · 奖助学金 · 宿舍/教室报修　|　资料以文件生效日期为准</p>
</header>
<main>
  <div class="chips" id="chips"></div>
  <div class="box">
    <input id="q" type="text" placeholder="直接输入你的问题，例如：补考申请几天内提交？" autocomplete="off">
    <button id="ask">提问</button>
  </div>
  <div id="loaderr">知识库加载失败：请在联网环境下打开本页面（kb.json 需可访问）。</div>
  <div id="chat"></div>
</main>
<footer>本助手仅依据现行有效制度文件作答，不提供医疗/投资/诊断建议，不代办、不推测。<br>资料来源：教务处、学生工作处、后勤管理处（课堂练习用虚构语料）。</footer>

<script>
let KB = null;
const chat = document.getElementById('chat');

fetch('kb.json').then(r=>{if(!r.ok) throw new Error('http '+r.status); return r.json();})
  .then(d=>{ KB = d; buildChips(); })
  .catch(e=>{ document.getElementById('loaderr').style.display='block'; });

const EXAMPLES = ["补考申请几天内提交？","缓考要什么材料？","国家奖学金多少钱？","宿舍漏水怎么报修？","教室投影坏了找谁？"];
function buildChips(){
  const c = document.getElementById('chips');
  EXAMPLES.forEach(t=>{ const s=document.createElement('span'); s.className='chip'; s.textContent=t;
    s.onclick=()=>{document.getElementById('q').value=t; ask();}; c.appendChild(s); });
}

function answer(q){
  q = (q||'').trim();
  const b = KB.boundary, R = b.responses;
  const has = arr => arr.some(k=>q.indexOf(k)>=0);
  // 1) 边界优先
  if(has(b.medical)) return {type:'boundary', kind:'医疗/用药', conclusion:R.medical, basis:[], next:''};
  if(has(b.investment)) return {type:'boundary', kind:'投资理财', conclusion:R.investment, basis:[], next:''};
  const de = b.disciplinary_evade;
  if(has(de.must) && has(de.signal)) return {type:'boundary', kind:'处分个案', conclusion:R.disciplinary_evade, basis:[], next:''};
  if(has(b.proxy.signal)) return {type:'boundary', kind:'代办代写', conclusion:R.proxy, basis:[], next:''};
  // 2) 主题匹配
  let best=null, bestScore=0;
  for(const t of KB.topics){
    let s=0; for(const k of t.keywords){ if(q.indexOf(k)>=0) s++; }
    if(s>bestScore){ best=t; bestScore=s; }
  }
  if(best && bestScore>=1) return {type:'topic', id:best.id, conclusion:best.conclusion, basis:best.basis, next:best.next};
  // 3) 兜底
  return {type:'fallback', conclusion:KB.fallback, basis:[], next:''};
}

function render(q){
  const r = answer(q);
  const wrap = document.createElement('div');
  let html = '';
  html += '<div class="msg user">你：'+escapeHtml(q)+'</div>';
  if(r.type==='topic'){
    html += '<div class="msg bot">';
    html += seg('【结论】', r.conclusion);
    html += '<div class="seg"><div class="lab">【依据】</div>';
    r.basis.forEach(id=>{ const cl=clauseById(id); if(cl) html += srcHtml(cl); });
    html += '</div>';
    html += seg('【下一步】', r.next);
    html += '<div class="meta">资料以文件生效日期为准；如与学校最新通知不一致，以正式文件为准。</div>';
    html += '</div>';
  } else if(r.type==='boundary'){
    html += '<div class="msg bwarning">'+seg('【边界提示】', r.conclusion)+'</div>';
  } else {
    html += '<div class="msg bfallback">'+seg('【未收录】', r.conclusion)+'</div>';
  }
  wrap.innerHTML = html;
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}
function seg(lab,val){ return '<div class="seg"><div class="lab">'+lab+'</div><div class="val">'+escapeHtml(val)+'</div></div>'; }
function srcHtml(cl){ return '<div class="src"><b>《'+cl.file+'》'+cl.clause+'</b>（'+cl.version+'）<br>'+escapeHtml(cl.text)+'</div>'; }
function clauseById(id){ return KB.clauses.find(c=>c.id===id); }
function escapeHtml(s){ return (s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function ask(){
  const el = document.getElementById('q');
  const v = el.value.trim();
  if(!v) return;
  if(!KB){ document.getElementById('loaderr').style.display='block'; return; }
  render(v);
  el.value='';
}
document.getElementById('ask').onclick = ask;
document.getElementById('q').addEventListener('keydown', e=>{ if(e.key==='Enter') ask(); });
</script>
</body>
</html>
